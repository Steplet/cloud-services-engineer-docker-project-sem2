name: momo-store

# Dev: backend и frontend напрямую, без gateway
# Запуск: docker compose -f docker-compose.dev.yml up -d --build
# Перед dev останови prod: docker compose down

services:
  backend:
    build:
      context: ./backend
    image: ${IMAGE_PREFIX:-local}/momo-backend:${TAG:-local}
    ports:
      - "${API_PUBLISH_PORT:-8081}:8081"
    networks:
      - edge-net
    secrets:
      - app_secret
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    mem_limit: 256m
    cpus: 0.50

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-http://localhost:8081}
    image: ${IMAGE_PREFIX:-local}/momo-frontend:${TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-80}:8080"
    networks:
      - edge-net
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,uid=101,gid=101,mode=0755
      - /var/run:size=16M,uid=101,gid=101,mode=0755
      - /var/log/nginx:size=16M,uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    mem_limit: 128m
    cpus: 0.25

networks:
  edge-net:
    driver: bridge

volumes:
  backend-logs:

secrets:
  app_secret:
    file: ./secrets/app_secret.txt.example
