name: momo-store

services:
  # --- Backend ---
  backend:
    build:
      context: ./backend
    image: ${IMAGE_PREFIX:-local}/momo-backend:${TAG:-local}
    expose:
      - "8081" 
    networks:
      - backend-net
    secrets:
      - app_secret
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    mem_limit: 256m
    cpus: 0.50

  # --- Gateway ---
  gateway:
    build:
      context: ./nginx
    image: ${IMAGE_PREFIX:-local}/momo-gateway:${TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${API_PUBLISH_PORT:-8081}:8081"
    networks:
      - backend-net
      - edge-net
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,uid=101,gid=101,mode=0755
      - /var/run:size=16M,uid=101,gid=101,mode=0755
      - /var/log/nginx:size=16M,uid=101,gid=101,mode=0755
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    mem_limit: 128m
    cpus: 0.25

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-http://localhost:8081}
    image: ${IMAGE_PREFIX:-local}/momo-frontend:${TAG:-local}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-80}:8080"
    networks:
      - edge-net
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,uid=101,gid=101,mode=0755
      - /var/run:size=16M,uid=101,gid=101,mode=0755
      - /var/log/nginx:size=16M,uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    mem_limit: 128m
    cpus: 0.25

  # Dev frontend
  frontend-dev:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-http://localhost:8081}
    image: ${IMAGE_PREFIX:-local}/momo-frontend:${TAG:-local}
    profiles: ["dev"]
    depends_on:
      backend-dev:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-80}:8080"
    networks:
      - edge-net
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /var/cache/nginx:size=32M,uid=101,gid=101,mode=0755
      - /var/run:size=16M,uid=101,gid=101,mode=0755
      - /var/log/nginx:size=16M,uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    mem_limit: 128m
    cpus: 0.25

  # --- Dev profile: backend без gateway ---
  # Запуск: docker compose --profile dev up -d --build
  backend-dev:
    build:
      context: ./backend
    image: ${IMAGE_PREFIX:-local}/momo-backend:${TAG:-local}
    profiles: ["dev"]
    ports:
      - "${API_PUBLISH_PORT:-8081}:8081"
    networks:
      - edge-net
    secrets:
      - app_secret
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    mem_limit: 256m
    cpus: 0.50

networks:
  # внутренняя сеть
  backend-net:
    driver: bridge
    internal: true
  # сеть наружного контура
  edge-net:
    driver: bridge

volumes:
  backend-logs:

secrets:
  app_secret:
    file: ./secrets/app_secret.txt.example
